<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Deepak Parmar</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-box">

        <h1>Create Account</h1>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <p class="password-info">
                Minimum 8 characters and at least 1 number.
            </p>

            <button type="submit">
                Register
            </button>

            <p id="message"></p>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

    <script src="register.js"></script>

</body>

</html>
