<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="auth-box">

        <h1>Login</h1>

        <form id="loginForm">

            <input
                type="text"
                id="loginInput"
                placeholder="Username or Email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="message"></p>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

       
    </div>

    <script src="login.js"></script>

</body>

</html>
